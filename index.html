<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* ── PWA INSTALL BANNER ── */
.pwa-banner {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
  background: var(--navy); color: white;
  padding: 14px 20px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.pwa-banner.show { transform: translateY(0); }
.pwa-icon {
  width: 44px; height: 44px; border-radius: 10px;
  background: var(--green); display: grid; place-items: center;
  flex-shrink: 0; font-family: 'Nunito', sans-serif;
  font-weight: 800; font-size: 1rem; color: var(--navy);
}
.pwa-text { flex: 1; }
.pwa-text strong { display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 2px; }
.pwa-text span { font-size: 0.74rem; color: rgba(255,255,255,0.65); }
.pwa-install {
  background: var(--green); color: var(--navy);
  border: none; border-radius: 8px; padding: 9px 16px;
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.8rem;
  cursor: pointer; flex-shrink: 0; white-space: nowrap;
}
.pwa-dismiss {
  background: none; border: none; color: rgba(255,255,255,0.5);
  font-size: 1.2rem; cursor: pointer; padding: 4px; flex-shrink: 0; line-height: 1;
}
/* iOS instruction banner */
.ios-banner {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 999;
  background: var(--navy); color: white;
  padding: 16px 20px 20px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  border-radius: 16px 16px 0 0;
}
.ios-banner.show { transform: translateY(0); }
.ios-banner-title { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.92rem; margin-bottom: 8px; display: flex; justify-content: space-between; }
.ios-banner-body { font-size: 0.82rem; color: rgba(255,255,255,0.75); line-height: 1.6; }
.ios-banner-body svg { display: inline; vertical-align: middle; margin: 0 3px; }
.ios-arrow {
  position: absolute; bottom: -8px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 10px solid var(--navy);
}

<style>
:root {
  --green:#7dc242;--green-dark:#5fa32e;--green-light:#e8f5d9;--green-mid:#c4e89d;
  --teal:#2eaac1;--teal-dark:#1d8fa4;--teal-light:#d4f0f6;
  --navy:#1a2d42;--navy-mid:#2c4460;
  --text:#2d3a2e;--text-mid:#4a5c4b;--muted:#7a8f7b;
  --bg:#f4f7f0;--white:#ffffff;--border:#d8e8c8;--border-mid:#c0d8a8;
  --red:#e05a5a;--shadow:0 4px 24px rgba(45,90,45,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Nunito Sans',sans-serif;font-weight:400;min-height:100vh;display:flex;flex-direction:column;}

.progress-wrap{background:var(--border);height:4px;position:sticky;top:0;z-index:99;flex-shrink:0;}
.progress-fill{height:100%;background:linear-gradient(to right,var(--green),var(--teal));transition:width .5s cubic-bezier(.4,0,.2,1);border-radius:0 2px 2px 0;}

.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:60px 20px;color:var(--muted);}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-title{font-family:'Nunito',sans-serif;font-weight:700;font-size:.9rem;color:var(--navy);margin-bottom:4px;}
.loader-sub{font-size:.8rem;}

.main{max-width:560px;margin:0 auto;padding:28px 16px 40px;flex:1;width:100%;}

.step-indicator{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:24px;}
.si-item{display:flex;align-items:center;gap:4px;}
.si-dot{width:28px;height:28px;border-radius:50%;background:var(--white);border:2px solid var(--border);display:grid;place-items:center;font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:700;color:var(--muted);transition:all .3s;flex-shrink:0;}
.si-dot.active{background:var(--green);border-color:var(--green);color:white;box-shadow:0 0 0 4px var(--green-light);}
.si-dot.done{background:var(--green);border-color:var(--green);color:white;}
.si-dot.done span{display:none;}
.si-dot.done::after{content:'';width:10px;height:8px;background:white;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%);}
.si-line{width:20px;height:2px;background:var(--border);transition:background .3s;flex-shrink:0;}
.si-line.done{background:var(--green);}

.card{background:var(--white);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
.card-header{padding:24px 24px 0;}
.step-tag{display:inline-flex;align-items:center;gap:6px;background:var(--green-light);color:var(--green-dark);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;border-radius:10px;margin-bottom:12px;}
.card-q{font-family:'Nunito',sans-serif;font-size:1.35rem;font-weight:800;color:var(--navy);line-height:1.25;margin-bottom:6px;}
.card-hint{font-size:.84rem;color:var(--muted);line-height:1.55;}
.card-body{padding:20px 24px 24px;}

.options{display:flex;flex-direction:column;gap:10px;}
.options.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt-btn{background:var(--bg);border:2px solid var(--border);border-radius:12px;color:var(--text);font-family:'Nunito Sans',sans-serif;font-size:.9rem;font-weight:600;padding:14px 16px;text-align:left;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;-webkit-tap-highlight-color:transparent;}
.opt-btn:hover,.opt-btn:focus{border-color:var(--green);background:var(--green-light);outline:none;}
.opt-btn.selected{border-color:var(--green);background:var(--green-light);color:var(--navy);}
.opt-icon-wrap{width:36px;height:36px;background:var(--white);border-radius:8px;display:grid;place-items:center;flex-shrink:0;transition:background .2s;}
.opt-btn.selected .opt-icon-wrap{background:var(--green);}
.opt-btn.selected .opt-icon-wrap svg{color:white;}
.opt-icon-wrap svg{color:var(--green);transition:color .2s;}
.opt-label{flex:1;line-height:1.3;}
.opt-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;flex-shrink:0;transition:all .2s;}
.opt-btn.selected .opt-check{background:var(--green);border-color:var(--green);}
.opt-btn.selected .opt-check::after{content:'';width:8px;height:6px;background:white;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%);}

.input-group{display:flex;flex-direction:column;gap:14px;}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.input-wrap label{display:block;font-size:.78rem;font-weight:700;color:var(--text-mid);margin-bottom:6px;}
.field{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--navy);font-family:'Nunito Sans',sans-serif;font-size:.92rem;font-weight:400;padding:13px 16px;outline:none;transition:all .2s;-webkit-appearance:none;}
.field::placeholder{color:var(--muted);font-weight:300;}
.field:focus{border-color:var(--green);background:var(--white);box-shadow:0 0 0 4px var(--green-light);}
.field.invalid{border-color:var(--red)!important;}
.field.valid{border-color:var(--green)!important;}
.field-error{font-size:.72rem;color:var(--red);margin-top:5px;min-height:16px;font-weight:600;}

.budget-display{font-family:'Nunito',sans-serif;font-size:2.2rem;font-weight:800;color:var(--navy);margin-bottom:6px;line-height:1;}
.budget-display .unit{font-size:1rem;color:var(--green-dark);font-weight:700;margin-left:4px;}
.slider-sub{font-size:.78rem;color:var(--muted);margin-bottom:20px;}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;background:var(--border);border-radius:3px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--green) 0%,var(--green) var(--pct,16%),var(--border) var(--pct,16%));height:6px;border-radius:3px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--white);border:3px solid var(--green);cursor:pointer;box-shadow:0 2px 8px rgba(125,194,66,.4);margin-top:-8px;transition:transform .15s;}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
.slider-labels{display:flex;justify-content:space-between;margin-top:8px;}
.slider-labels span{font-size:.72rem;color:var(--muted);}

.card-footer{background:var(--bg);border-top:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:10px;}
.btn-next{background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);color:var(--white);font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:700;letter-spacing:.04em;padding:13px 28px;border:none;border-radius:10px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(125,194,66,.35);}
.btn-next:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(125,194,66,.45);}
.btn-next:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-back{background:var(--white);border:2px solid var(--border);color:var(--muted);font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:600;padding:12px 18px;border-radius:10px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;}
.btn-back:hover{border-color:var(--green);color:var(--green-dark);}
.btn-submit{background:linear-gradient(135deg,var(--teal) 0%,var(--teal-dark) 100%)!important;box-shadow:0 4px 14px rgba(46,170,193,.35)!important;}
.btn-submit:hover{box-shadow:0 6px 20px rgba(46,170,193,.45)!important;}

.step-block{display:none;animation:stepIn .35s cubic-bezier(.4,0,.2,1);}
.step-block.active{display:block;}
@keyframes stepIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

.success-card{background:var(--white);border-radius:16px;box-shadow:var(--shadow);padding:36px 28px;text-align:center;}
.success-icon-wrap{width:72px;height:72px;background:var(--green-light);border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);}
.success-icon-wrap svg{color:var(--green);}
@keyframes popIn{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.success-title{font-family:'Nunito',sans-serif;font-size:1.6rem;font-weight:800;color:var(--navy);margin-bottom:10px;}
.success-body{font-size:.88rem;color:var(--muted);line-height:1.65;margin-bottom:24px;}
.contact-promise{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--teal-light);border-radius:10px;padding:12px 16px;font-size:.82rem;font-weight:600;color:var(--teal-dark);margin-bottom:20px;}
.summary-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px 20px;text-align:left;margin-bottom:24px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:.84rem;}
.summary-row:last-child{border-bottom:none;}
.summary-key{color:var(--muted);font-weight:600;}
.summary-val{color:var(--navy);font-weight:700;text-align:right;max-width:200px;}
.btn-reset{border:2px solid var(--border);background:var(--white);color:var(--muted);font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:600;padding:10px 20px;border-radius:10px;cursor:pointer;transition:all .2s;}
.btn-reset:hover{border-color:var(--green);color:var(--green-dark);}

footer{background:var(--white);box-shadow:0 -1px 8px rgba(0,0,0,0.05);padding:14px 20px;text-align:center;flex-shrink:0;}
footer span{font-size:.72rem;color:var(--muted);letter-spacing:.06em;}
footer strong{color:var(--text-mid);font-weight:700;}

@media(max-width:480px){
  .options.grid-2{grid-template-columns:1fr;}
  .card-header,.card-body{padding-left:18px;padding-right:18px;}
  .card-footer{padding:14px 18px;}
  .input-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="progress-wrap">
  <div class="progress-fill" id="progressFill" style="width:0%"></div>
</div>

<div class="main" id="mainArea">
  <div class="loader" id="loaderEl">
    <div class="spinner"></div>
    <div class="loader-title">Načítám formulář</div>
    <div class="loader-sub">Chvíli strpení...</div>
  </div>
</div>

<footer>
  <span>Created by <strong>LIBERTI</strong></span>
</footer>

<script>
const SB_URL='https://dtyfvxzkkyrfcvcornyq.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0eWZ2eHpra3lyZmN2Y29ybnlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MzIyNjUsImV4cCI6MjA5MzMwODI2NX0.5sAnryXTN9AUtKxK-895UEM7WJO__kD9_xb59KMs9iw';

async function sbFetch(path,options={}){
  const res=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:{'apikey':SB_ANON,'Authorization':`Bearer ${SB_ANON}`,'Content-Type':'application/json','Prefer':options.prefer||'return=representation'},...options});
  if(!res.ok)throw new Error(`${res.status}: ${await res.text()}`);
  const t=await res.text();return t?JSON.parse(t):null;
}

let steps=[],cur=0,answers={},formId=null,brokerName='';

async function loadForm(){
  const slug=new URLSearchParams(location.search).get('slug');
  if(!slug){showError('Chybí parametr slug v URL.<br>Kontaktujte makléře pro správný odkaz.');return;}
  try{
    const rows=await sbFetch(`forms?slug=eq.${encodeURIComponent(slug)}&select=id,name,broker,config&active=eq.true`);
    if(!rows||!rows.length){showError(`Formulář nebyl nalezen nebo není aktivní.`);return;}
    const form=rows[0];
    formId=form.id;brokerName=form.broker||'';
    steps=form.config?.steps||[];
    document.title=`${form.name} — Nezávazná konzultace`;
    if(!steps.length){showError('Formulář nemá žádné kroky.');return;}
    renderForm();
  }catch(e){showError('Nepodařilo se načíst formulář.<br><small>'+e.message+'</small>');}
}

function showError(msg){
  document.getElementById('mainArea').innerHTML=`<div class="loader"><div class="loader-title">Chyba</div><div class="loader-sub" style="text-align:center;line-height:1.6;">${msg}</div></div>`;
}

function renderForm(){
  const main=document.getElementById('mainArea');
  main.innerHTML=`
    <div class="step-indicator" id="stepIndicator"></div>
    <div id="stepsContainer"></div>
    <div class="step-block" id="step-success">
      <div class="success-card">
        <div class="success-icon-wrap"><svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="success-title">Poptávka odeslána!</div>
        <p class="success-body">Děkujeme za váš zájem. ${brokerName?'Makléř <strong>'+esc(brokerName)+'</strong>':'Náš makléř'} vás kontaktuje nejpozději do 24 hodin.</p>
        <div class="contact-promise"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Očekávejte kontakt do 24 hodin</div>
        <div class="summary-box" id="summaryBox"></div>
        <button class="btn-reset" onclick="location.reload()">Odeslat novou poptávku</button>
      </div>
    </div>`;
  const container=document.getElementById('stepsContainer');
  steps.forEach((step,idx)=>{
    const el=document.createElement('div');
    el.className='step-block'+(idx===0?' active':'');
    el.id='step-'+idx;
    el.innerHTML=buildStep(step,idx);
    container.appendChild(el);
  });
  // init sliders
  steps.forEach((step,idx)=>{
    if(step.type==='slider'){
      const cfg=getSliderCfg(idx);
      answers[step.id]=String(cfg.def);
      const sl=document.getElementById('sl-'+idx);
      if(sl){sl.min=cfg.min;sl.max=cfg.max;sl.step=cfg.step;sl.value=cfg.def;}
      refreshSlider(idx,cfg.def);
      const body=sl?.closest('.card-body');
      if(body){
        const spans=body.querySelectorAll('.slider-labels span');
        const unit=step.sliderMode==='mesicni'?' Kč/měs.':' Kč';
        if(spans[0])spans[0].textContent=parseInt(cfg.min).toLocaleString('cs-CZ')+unit;
        if(spans[1])spans[1].textContent=parseInt(cfg.max).toLocaleString('cs-CZ')+unit;
      }
    }
  });
  renderIndicator();
  updateProgress();
}

function buildStep(step,idx){
  const isLast=idx===steps.length-1;
  const stepLabel=`Krok ${idx+1} / ${steps.length}`;
  const back=idx>0?`<button class="btn-back" onclick="goTo(${idx-1})"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Zpět</button>`:'';
  let body='',next='';

  if(step.type==='single_select'||step.type==='multi_select'){
    const multi=step.type==='multi_select';
    const cls=multi?'options grid-2':'options';
    const icon=multi
      ?`<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`
      :`<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>`;
    const opts=(step.options||[]).map(o=>`
      <button class="opt-btn" data-si="${idx}" data-val="${esc(o)}" onclick="pickOpt(this,${idx},'${escJ(o)}',${multi})">
        <div class="opt-icon-wrap">${icon}</div>
        <span class="opt-label">${esc(o)}</span>
        <div class="opt-check"></div>
      </button>`).join('');
    body=`<div class="${cls}">${opts}</div>`;
    next=`<button class="btn-next" id="next-${idx}" disabled onclick="${isLast?'submitForm()':'goTo('+(idx+1)+')'}">
      ${isLast?'Odeslat poptávku':'Pokračovat'}
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">${isLast?'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>':'<polyline points="9 18 15 12 9 6"/>'}</svg>
    </button>`;
    if(isLast)next=next.replace('class="btn-next"','class="btn-next btn-submit"');

  }else if(step.type==='text_input'){
    body=`<div class="input-group"><div class="input-wrap">
      <label>Localita *</label>
      <input class="field" id="tf-${idx}" type="text" placeholder="Praha, Brno, Jihočeský kraj…" autocomplete="off"
        oninput="onText(${idx},this.value)">
    </div></div>`;
    next=`<button class="btn-next" id="next-${idx}" disabled onclick="${isLast?'submitForm()':'goTo('+(idx+1)+')'}">
      ${isLast?'Odeslat poptávku':'Pokračovat'}
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">${isLast?'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>':'<polyline points="9 18 15 12 9 6"/>'}</svg>
    </button>`;
    if(isLast)next=next.replace('class="btn-next"','class="btn-next btn-submit"');

  }else if(step.type==='slider'){
    body=`
      <div class="budget-display" id="bd-${idx}">5 000 000 <span class="unit">Kč</span></div>
      <div class="slider-sub">Přetáhněte posuvník</div>
      <input type="range" id="sl-${idx}" min="500000" max="30000000" step="500000" value="5000000"
        oninput="onSlider(${idx},this.value)">
      <div class="slider-labels"><span>500 000 Kč</span><span>30 000 000 Kč</span></div>`;
    next=`<button class="btn-next" id="next-${idx}" onclick="${isLast?'submitForm()':'goTo('+(idx+1)+')'}">
      ${isLast?'Odeslat poptávku':'Pokračovat'}
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">${isLast?'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>':'<polyline points="9 18 15 12 9 6"/>'}</svg>
    </button>`;
    if(isLast)next=next.replace('class="btn-next"','class="btn-next btn-submit"');

  }else if(step.type==='contact'){
    body=`<div class="input-group">
      <div class="input-row">
        <div class="input-wrap">
          <label>Jméno *</label>
          <input class="field" id="cj-${idx}" type="text" placeholder="Jan" autocomplete="given-name" oninput="chkContact(${idx})">
          <div class="field-error" id="ej-${idx}"></div>
        </div>
        <div class="input-wrap">
          <label>Příjmení *</label>
          <input class="field" id="cp-${idx}" type="text" placeholder="Novák" autocomplete="family-name" oninput="chkContact(${idx})">
          <div class="field-error" id="ep-${idx}"></div>
        </div>
      </div>
      <div class="input-wrap">
        <label>Telefon *</label>
        <input class="field" id="ct-${idx}" type="tel" placeholder="+420 777 000 111" autocomplete="tel" oninput="chkContact(${idx})">
        <div class="field-error" id="et-${idx}"></div>
      </div>
      <div class="input-wrap">
        <label>E-mail *</label>
        <input class="field" id="ce-${idx}" type="email" placeholder="jan.novak@email.cz" autocomplete="email" oninput="chkContact(${idx})">
        <div class="field-error" id="ee-${idx}"></div>
      </div>
    </div>`;
    next=`<button class="btn-next btn-submit" id="next-${idx}" disabled onclick="${isLast?'submitForm()':'goTo('+(idx+1)+')'}">
      ${isLast?'Odeslat poptávku':'Pokračovat'}
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">${isLast?'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>':'<polyline points="9 18 15 12 9 6"/>'}</svg>
    </button>`;
  }

  return `<div class="card">
    <div class="card-header">
      <div class="step-tag">${stepLabel}</div>
      <div class="card-q">${esc(step.question||'')}</div>
      ${step.hint?`<div class="card-hint">${esc(step.hint)}</div>`:''}
    </div>
    <div class="card-body">${body}</div>
    <div class="card-footer">${back}${next}</div>
  </div>`;
}

// ── Handlers ──
function isRental(){
  for(const v of Object.values(answers)){
    const s=Array.isArray(v)?v.join(' '):String(v);
    if(s.toLowerCase().includes('pronáj')||s.toLowerCase().includes('pronaj'))return true;
  }
  return false;
}

function getSliderCfg(stepIdx){
  const step=steps[stepIdx];
  const mode=step?.sliderMode||(isRental()?'mesicni':'miliony');
  const fmt=v=>{const n=parseInt(v);return n>=1000000?(n/1000000).toFixed(2).replace(/\.?0+$/,'')+'M Kč':n>=1000?(n/1000).toFixed(0)+'k Kč':n+' Kč';};
  if(mode==='mesicni'){
    const min=step?.sliderMin||5000,max=step?.sliderMax||100000;
    return {min,max,step:1000,def:Math.round((min+max)/2/1000)*1000,fmt:v=>parseInt(v).toLocaleString('cs-CZ')+' Kč/měs.',pctOf:v=>((v-min)/(max-min)*100),segments:null};
  }
  if(mode==='segmenty'){
    const min=step?.sliderMin||500000,max=step?.sliderMax||10000000,n=Math.max(2,step?.sliderSegments||5);
    const stepSize=Math.round((max-min)/(n-1));
    return {min,max,step:stepSize,def:min,fmt,pctOf:v=>((v-min)/(max-min)*100),segments:n};
  }
  if(mode==='custom'){
    const min=step?.sliderMin||0, max=Math.max(step?.sliderMax||10000000, (step?.sliderMin||0)+1);
    const suffix=step?.sliderUnit==='monthly'?' Kč/měs.':' Kč';
    return {min,max,step:Math.max(1,Math.round((max-min)/100)),def:Math.round((min+max)/2),fmt:v=>parseInt(v).toLocaleString('cs-CZ')+suffix,pctOf:v=>((v-min)/(max-min)*100),segments:null};
  }
  return {min:500000,max:30000000,step:500000,def:5000000,fmt:v=>parseInt(v).toLocaleString('cs-CZ')+' Kč',pctOf:v=>((v-500000)/(30000000-500000)*100),segments:null};
}

function refreshSlider(idx,n){
  const cfg=getSliderCfg(idx);
  const bd=document.getElementById('bd-'+idx);
  const sl=document.getElementById('sl-'+idx);
  if(bd)bd.textContent=cfg.fmt(n);
  if(sl)sl.style.setProperty('--pct',Math.min(100,Math.max(0,cfg.pctOf(parseInt(n)))).toFixed(1)+'%');
}

function updateSlidersForRental(){
  steps.forEach((s,i)=>{
    if(s.type!=='slider')return;
    // Only update sliders without explicit mode set (auto-detect from answers)
    if(s.sliderMode && s.sliderMode!=='miliony') return;
    if(s.sliderMode==='miliony') return; // explicit miliony — don't auto-switch
    const cfg=getSliderCfg(i);
    const sl=document.getElementById('sl-'+i);
    if(!sl)return;
    sl.min=cfg.min; sl.max=cfg.max; sl.step=cfg.step;
    const cur=parseInt(answers[s.id]||cfg.def);
    const clamped=Math.min(Math.max(cur,cfg.min),cfg.max);
    sl.value=clamped; answers[s.id]=String(clamped);
    refreshSlider(i,clamped);
    const body=sl.closest('.card-body');
    if(body){
      const spans=body.querySelectorAll('.slider-labels span');
      const unit=isRental()?' Kč/měs.':' Kč';
      if(spans[0])spans[0].textContent=parseInt(cfg.min).toLocaleString('cs-CZ')+unit;
      if(spans[1])spans[1].textContent=parseInt(cfg.max).toLocaleString('cs-CZ')+unit;
    }
  });
}

function pickOpt(btn,idx,val,multi){
  const step=steps[idx];
  if(!multi){
    document.querySelectorAll(`.opt-btn[data-si="${idx}"]`).forEach(b=>b.classList.remove('selected'));
    answers[step.id]=val;btn.classList.add('selected');
  }else{
    if(!answers[step.id])answers[step.id]=[];
    const arr=answers[step.id];const i=arr.indexOf(val);
    if(i>-1){arr.splice(i,1);btn.classList.remove('selected');}
    else{arr.push(val);btn.classList.add('selected');}
  }
  const nb=document.getElementById('next-'+idx);
  if(nb)nb.disabled=multi?!(answers[step.id]&&answers[step.id].length>0):!answers[step.id];
  // After selection, update sliders in case rental was chosen
  updateSlidersForRental();
}

function onSlider(idx,val){
  answers[steps[idx].id]=val;
  refreshSlider(idx,val);
}

function fv(id){return(document.getElementById(id)?.value||'').trim();}
function fs(id,eid,ok,msg){
  const f=document.getElementById(id);const e=document.getElementById(eid);
  if(!f||!e)return;
  f.classList.toggle('valid',ok);f.classList.toggle('invalid',!ok&&fv(id).length>0);
  e.textContent=(!ok&&fv(id).length>0)?msg:'';
}

function chkContact(idx){
  const j=fv(`cj-${idx}`),p=fv(`cp-${idx}`);
  const t=fv(`ct-${idx}`).replace(/[\s\-\+]/g,'');
  const m=fv(`ce-${idx}`);
  const telOk=t.length>=9&&/^\d+$/.test(t);
  const mailOk=m.length>=6&&m.includes('@')&&m.indexOf('@')>0&&m.indexOf('@')<m.length-1;
  fs(`cj-${idx}`,`ej-${idx}`,j.length>=2,'Zadejte jméno');
  fs(`cp-${idx}`,`ep-${idx}`,p.length>=2,'Zadejte příjmení');
  fs(`ct-${idx}`,`et-${idx}`,telOk,'Min. 9 číslic');
  fs(`ce-${idx}`,`ee-${idx}`,mailOk,'Neplatný e-mail');
  const nb=document.getElementById('next-'+idx);
  if(nb)nb.disabled=!(j.length>=2&&p.length>=2&&telOk&&mailOk);
}

// ── Navigation ──
function goTo(n){
  if(n<0||n>=steps.length)return;
  document.getElementById('step-'+cur)?.classList.remove('active');
  cur=n;
  document.getElementById('step-'+cur)?.classList.add('active');
  renderIndicator();updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderIndicator(){
  const el=document.getElementById('stepIndicator');if(!el)return;
  el.innerHTML='';
  steps.forEach((_,i)=>{
    const item=document.createElement('div');item.className='si-item';
    const dot=document.createElement('div');
    dot.className='si-dot'+(i===cur?' active':i<cur?' done':'');
    dot.innerHTML=i<cur?'':`<span>${i+1}</span>`;
    item.appendChild(dot);
    if(i<steps.length-1){const line=document.createElement('div');line.className='si-line'+(i<cur?' done':'');item.appendChild(line);}
    el.appendChild(item);
  });
}

function updateProgress(){
  const pct=steps.length>0?Math.round(cur/steps.length*100):0;
  const fill=document.getElementById('progressFill');
  if(fill)fill.style.width=pct+'%';
}

// ── Submit ──
async function submitForm(){
  // Find contact step
  let contact={};let contactIdx=-1;
  steps.forEach((s,i)=>{if(s.type==='contact')contactIdx=i;});
  if(contactIdx>=0){
    contact={
      jmeno:fv(`cj-${contactIdx}`),prijmeni:fv(`cp-${contactIdx}`),
      telefon:fv(`ct-${contactIdx}`),email:fv(`ce-${contactIdx}`)
    };
  }
  const btn=document.getElementById('next-'+cur);
  if(btn){btn.disabled=true;btn.textContent='Odesílám...';}

  // Readable answers
  const readableAnswers={};
  steps.forEach(s=>{
    if(s.type==='contact')return;
    const v=answers[s.id];
    if(v!==undefined){
      readableAnswers[s.question]=Array.isArray(v)?v.join(', '):(s.type==='slider'?parseInt(v).toLocaleString('cs-CZ')+' Kč':v);
    }
  });

  try{
    await sbFetch('leads',{method:'POST',prefer:'return=minimal',body:JSON.stringify({form_id:formId,contact,answers:readableAnswers})});
  }catch(e){console.warn('Lead save:',e.message);}

  // Summary
  const rows=Object.entries(readableAnswers).map(([k,v])=>
    `<div class="summary-row"><span class="summary-key">${esc(k)}</span><span class="summary-val">${esc(String(v))}</span></div>`
  ).join('');
  const cRow=contact.jmeno?`<div class="summary-row"><span class="summary-key">Kontakt</span><span class="summary-val">${esc(contact.jmeno+' '+contact.prijmeni)}, ${esc(contact.telefon)}</span></div>`:'';
  document.getElementById('summaryBox').innerHTML=rows+cRow;

  document.getElementById('step-'+cur)?.classList.remove('active');
  document.getElementById('step-success')?.classList.add('active');
  const fill=document.getElementById('progressFill');if(fill)fill.style.width='100%';
  window.scrollTo({top:0,behavior:'smooth'});
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escJ(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

loadForm();
</script>

<script>
// ── PWA: Service Worker ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ── PWA: Install prompt ──
const DISMISSED_KEY = 'formey_pwa_dismissed';
let deferredPrompt = null;

function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
function isInStandaloneMode() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
}
function wasDismissed() {
  try { return localStorage.getItem(DISMISSED_KEY) === '1'; } catch { return false; }
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!wasDismissed() && !isInStandaloneMode()) {
    setTimeout(() => document.getElementById('pwaBanner').classList.add('show'), 2000);
  }
});

document.getElementById('pwaInstallBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('pwaBanner').classList.remove('show');
  if (outcome === 'accepted') {
    try { localStorage.setItem(DISMISSED_KEY, '1'); } catch {}
  }
});

document.getElementById('pwaDismiss').addEventListener('click', () => {
  document.getElementById('pwaBanner').classList.remove('show');
  try { localStorage.setItem(DISMISSED_KEY, '1'); } catch {}
});

// iOS — show after 3s if not installed and not dismissed
if (isIOS() && !isInStandaloneMode() && !wasDismissed()) {
  setTimeout(() => {
    document.getElementById('iosBanner').classList.add('show');
  }, 3000);
}
</script>
